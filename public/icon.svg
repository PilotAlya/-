<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9AE600"/>
      <stop offset="100%" stop-color="#72B600"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3F6212" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Lime Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#limeGrad)"/>

  <!-- Subtle inner border for polish -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.2"/>

  <!-- White Letters АВ -->
  <g filter="url(#subtleShadow)">
    <text
      x="256"
      y="348"
      text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', 'Manrope', Arial, sans-serif"
      font-weight="900"
      font-size="240"
      fill="#FFFFFF"
      letter-spacing="-6"
    >АВ</text>
  </g>
</svg>
